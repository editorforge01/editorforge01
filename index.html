<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EditorForge</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#050505;color:#fff}
.hero{
height:100vh;
background:url('BANNER.jpeg') center/cover no-repeat;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
position:relative;
}
.hero::before{
content:"";
position:absolute;
inset:0;
background:rgba(0,0,0,.6);
}
.logo{
width:170px;
border-radius:50%;
box-shadow:0 0 30px #00d9ff;
z-index:1;

@keyframes float{
50%{transform:translateY(-10px);}
}
.hero h1,.hero p,.buttons{z-index:1}
.hero h1{font-size:60px;margin:20px 0}
.hero p{font-size:22px}
.buttons{display:flex;gap:15px;margin-top:25px}
.btn,.btn2{
padding:14px 28px;
border-radius:40px;
text-decoration:none;
font-weight:bold;
}
.btn{background:#ff7a00;color:#fff}
.btn2{background:#111;color:#00d9ff;border:1px solid #00d9ff}
section{padding:70px 8%}
.title{text-align:center;color:#ff7a00;font-size:38px;margin-bottom:35px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
.card{background:#111;padding:25px;border-radius:18px}
footer{text-align:center;padding:30px;background:#111}
</style>
</head>

<body>

<div class="hero">
